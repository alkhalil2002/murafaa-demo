<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>مُرافعة — لا يوجد اتصال</title>
    <style>
      body {
        margin: 0; min-height: 100dvh; display: grid; place-items: center;
        background: #faf6ec; color: #1c1a15; text-align: center; padding: 24px;
        font-family: system-ui, "Segoe UI", sans-serif;
      }
      .card {
        max-width: 380px; background: #fff; border: 1px solid #d9cfb8;
        border-radius: 16px; padding: 28px 24px;
      }
      h1 { font-size: 22px; margin: 0 0 8px; color: #0e3a30; }
      p { margin: 0; color: #5a5446; line-height: 1.7; font-size: 15px; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>لا يوجد اتصال بالإنترنت</h1>
      <p>
        بيانات القضايا لا تُحفَظ على الجهاز حمايةً لسرّية الملفات.
        أعد المحاولة عند عودة الاتصال.
      </p>
    </div>
  </body>
</html>
